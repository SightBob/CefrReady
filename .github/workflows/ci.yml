name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Next 16 requires >=20.9.0 (node_modules/next/package.json engines).
          # No `engines` field and no .nvmrc in this repo — pin to match local dev (24.x).
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # No DATABASE_URL on purpose: src/app/api/verb-banks/schema-live.test.ts is a
      # live-DB integration test that self-skips when the variable is absent.
      # Setting a dummy URL makes those 6 tests fail instead (they try to connect).
      # ส่วน next build ต้องมี DATABASE_URL ตอนประเมิน module (layout → src/lib/auth
      # → src/db throw เมื่อไม่มีค่า) จึงใส่ค่าปลอมเฉพาะ step Build ข้างล่าง — build
      # ไม่ต่อฐานข้อมูลจริง และ step Unit tests ยังไม่ได้ env นี้ตามเดิม

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build
        # next build ประเมิน module ของ layout → src/lib/auth → src/db ซึ่ง throw
        # เมื่อไม่มี DATABASE_URL (CI ไม่มี DB โดยตั้งใจ) ค่าปลอมนี้ใช้ให้ module
        # evaluation ผ่านเท่านั้น — ยืนยันแล้วว่า build ไม่ต่อฐานข้อมูลจริง
        # (ไม่ตั้งที่ขั้น Unit tests เพื่อให้เทสต์ที่ต้องใช้ DB ยัง skip ตามเดิม)
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5499/ci_placeholder
        run: npx next build